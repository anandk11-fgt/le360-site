<style>

/* Previous/next: Carbon icon buttons */
.nav { position: fixed; z-index: 4; display: flex; gap: 1px; right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); }

<script>

const DEMO_Q = [
  ["Driving Results", "Holds self and team to a high level of accountability."],
  ["Driving Results", "Motivates team to overcome obstacles by removing barriers and planning for contingencies."],
  ["Acting Strategically", "Designs and shares functional plans that translate broader organizational goals into actions."],
  ["Leading Change", "Invites and incorporates diverse perspectives into decision making."],
  ["Building Talent", "Provides coaching and mentoring to develop others."],
];
const DEMO_DEFS = { "Driving Results": "Delivering on commitments and holding yourself and the team accountable for outcomes.", "Acting Strategically": "Turning the organisation's goals into clear plans, and making sound trade-offs between priorities.", "Leading Change": "Adapting to people and situations, bringing in different views, and building trust.", "Building Talent": "Setting clear expectations, coaching others, and putting the right people in the right roles." };
const DEMO = {
  raterName: "Rahul", project: "Director 360", client: "TransUnion CIBIL", due: "2026-11-30",
  scale: { max: 5, labels: ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"] },
  questions: DEMO_Q.map(([section, text], i) => ({ id: "q" + (i + 1), section, type: "rating", text, definition: DEMO_DEFS[section] || "" }))
    .concat([{ id: "c1", section: "In your own words", type: "text", text: "Please specify 2 functional areas for improvement.", optional: true }]),
  assignments: [
    { pid: "a1", participant: "Rahul Mehta", relation: "Self", status: "pending", answers: {} },
    { pid: "a2", participant: "Priya Shah", relation: "Manager", status: "in_progress", answers: { q1: 4, q2: 5 } },
    { pid: "a3", participant: "Dev Kumar", relation: "Manager", status: "pending", answers: {} },
    { pid: "a4", participant: "Neha Jain", relation: "Peer", status: "completed", answers: {} },
  ],
};

const BOOT = window.__LE360 || null;
const GAS = !!(BOOT && BOOT.transport === "gas" && window.google && google.script && google.script.run);
const params = BOOT ? new Map(Object.entries(BOOT.params || {})) : new URLSearchParams(location.search);
const token = params.get("t") || "";
const preview = !!params.get("preview");
const project = (params.get("p") || "").replace(/[^A-Za-z0-9_-]/g, "");
let demo = (!token && !preview) || !GAS;
document.documentElement.lang = "en";
let data = null;
let cur = null;
let idx = 0;
let mode = "hub";
let saveTimer = null, advanceTimer = null;
const pendingSaves = new Map();
let saving = 0;
const $ = (id) => document.getElementById(id);
const stage = $("stage");

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const first = (name) => String(name).split(" ")[0];
const qsOf = (a) => (a && a.qids ? data.questions.filter((q) => a.qids.indexOf(q.id) !== -1) : data.questions);
const qs = () => qsOf(cur);
function stepsOf(a) {
  const out = []; let last = null, n = 0;
  qsOf(a).forEach((q) => {
    if (data.sectionScreens && q.section !== last) out.push({ sec: q.section, def: q.definition || "" });
    last = q.section;
    out.push({ q, n: ++n });
  });
  return out;
}
const steps = () => stepsOf(cur);
const stepAt = (i) => (i > 0 && i < lastIdx() ? steps()[i - 1] : null);
const curQ = () => { const s = stepAt(idx); return s && s.q ? s.q : null; };
const stepOfQ = (q) => steps().findIndex((s) => s.q && s.q.id === q.id) + 1;
const lastIdx = () => steps().length + 1;
const editing = () => cur && cur.status === "completed";
const isSelf = (a) => a.relation === "Self";
const answered = (a, q) => (q.type === "text" ? !!(a.answers[q.id] || "").trim() || q.optional : q.id in a.answers);
const ratingQs = (a) => qsOf(a === undefined ? cur : a).filter((q) => q.type === "rating");
const progressOf = (a) => ratingQs(a).filter((q) => q.id in a.answers).length;
const roleText = (a) => isSelf(a) ? "Your self-assessment" : (data.roleLabels && data.roleLabels[a.relation]) ? `You are their ${esc(data.roleLabels[a.relation]).toLowerCase()}` : `You are their ${a.relation === "Other" ? "colleague" : a.relation.toLowerCase()}`;
const dueText = () => data.due ? new Date(data.due).toLocaleDateString("en-GB", { day: "numeric", month: "long" }) : "";

function gas(fn, arg) {
  return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg));
}
async function api(body) {
  const json = await (body ? gas("apiSave", { ...body, p: project }) : gas("apiLoad", { p: project, t: token, preview: preview ? 1 : 0 }));
  if (!json.ok) { const e = new Error(json.error || "Something went wrong."); e.final = !!json.final; e.closed = !!json.closed; e.theme = json.theme; e.closedTitle = json.closedTitle; throw e; }
  return json;
}
const minutesFor = (a) => { const q = qsOf(a); return Math.max(2, Math.round(q.filter((x) => x.type === "rating").length * 0.25 + q.filter((x) => x.type === "text").length)); };
/*
  Saving: each person has their own timer. Answers are sent after a short pause (and at least every 20 seconds while
  someone keeps answering), and straight away when the rater moves to another person, leaves the page or submits.
*/
function queueSave(a = cur) {
  if (demo || !a) return;
  if (a.status === "completed") { $("save").textContent = "Resubmit to save"; return; }
  const p = pendingSaves.get(a.pid) || { a, first: Date.now(), timer: null };
  clearTimeout(p.timer);
  const wait = Math.max(0, Math.min(6000, p.first + 20000 - Date.now()));
  p.timer = setTimeout(() => flushSave(a), wait);
  pendingSaves.set(a.pid, p);
  $("save").textContent = "Saving…";
}
async function flushSave(a) {
  const p = pendingSaves.get(a.pid);
  if (!p) return;
  clearTimeout(p.timer);
  pendingSaves.delete(a.pid);
  const body = { t: token, pid: a.pid, answers: { ...a.answers }, submit: false };
  saving++;
  try {
    for (let k = 0; k < 3; k++) {
      try { await api(body); if (!pendingSaves.size && saving === 1) $("save").textContent = "Saved"; return; }
      catch (e) { if (e.final) { $("save").textContent = ""; return; } await new Promise((r) => setTimeout(r, 2000 * (k + 1))); }
    }
    $("save").textContent = "Not saved yet";
    queueSave(a);
  } finally { saving--; }
}
const flushAll = () => Promise.all([...pendingSaves.values()].map((p) => flushSave(p.a)));
window.addEventListener("pagehide", () => { flushAll(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });
window.addEventListener("beforeunload", (e) => { if (pendingSaves.size || saving) { flushAll(); e.preventDefault(); e.returnValue = ""; } });

function paint(html, back = false) {
  clearTimeout(advanceTimer);
  stage.innerHTML = "";
  const el = document.createElement("section");
  el.className = "screen " + (back ? "enter-back" : "enter");
  el.innerHTML = html;
  stage.appendChild(el);
  stage.scrollTop = 0;
  const h = el.querySelector("h1, h2");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  return el;
}
function chrome() {
  const inSurvey = mode === "survey";
  $("nav").hidden = !inSurvey || idx === 0;
  $("prev").disabled = idx <= 1;
  $("next").disabled = idx >= lastIdx();
  $("back").hidden = !(inSurvey && data.assignments.length > 1);
  const dash = $("dash"); dash.hidden = !(data.preview && data.dashboardUrl && !inSurvey);
  if (!dash.hidden) dash.href = data.dashboardUrl;
  $("who").textContent = inSurvey ? (isSelf(cur) ? "Self-assessment" : `Feedback for ${cur.participant}`) : data.client || "";
  const done = data.assignments.filter((a) => a.status === "completed").length;
  $("bar").style.width = (inSurvey ? (100 * progressOf(cur)) / ratingQs().length : (100 * done) / data.assignments.length) + "%";
}

function showHub(back = false) {
  if (cur) flushSave(cur);
  mode = "hub"; cur = null; idx = 0;
  const list = data.assignments;
  const left = list.filter((a) => a.status !== "completed").length;
  if (!left && !data.allowEdit) return showEnd("All done — thank you", "You've given feedback for everyone on your list. You can close this page.");
  const items = list.map((a, i) => {
    const done = a.status === "completed";
    const n = progressOf(a);
    const chip = done ? `<span class="chip done">Done ✓</span>` : n ? `<span class="chip started">${n} of ${ratingQs(a).length}</span>` : `<span class="chip">Not started</span>`;
    return `<li><button class="person" data-pick="${i}" ${done && !data.allowEdit ? "disabled" : ""}>
      <span class="key">${String.fromCharCode(65 + i)}</span>
      <span class="nm">${isSelf(a) ? "Yourself" : esc(a.participant)}<span class="rl">${roleText(a)}${done && data.allowEdit ? " · submitted, open to change your answers" : ""}</span></span>${chip}</button></li>`;
  }).join("");
  const head = left ? `Hi ${esc(data.raterName)}, ${left === 1 ? "one person is" : `${left} people are`} waiting for your feedback` : "All done — thank you";
  const sub = left
    ? `Each takes about ${minutesFor(list[0])} minutes. Answers about peers and team members are combined with other people's and never shown with your name.${list.some((a) => a.relation === "Manager") ? " Feedback you give as someone's manager is shown in their report under “Manager”." : ""}${dueText() ? ` Please finish by ${dueText()}.` : ""}`
    : "You've given feedback for everyone on your list. If you need to change any answers, open the person below and resubmit. Otherwise you can close this page.";
  const el = paint(`<div class="hero">
    <h1>${head}</h1>
    <p>${sub}</p>
    <ul class="people">${items}</ul>
    <p class="press" style="margin-top:14px">Choose a person, or press <b>A</b>–<b>${String.fromCharCode(64 + list.length)}</b></p>
    ${data.privacy ? `<p class="privacy">${esc(data.privacy)}</p>` : ""}</div>`, back);
  el.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => startFor(data.assignments[Number(b.dataset.pick)])));
  chrome();
}

function startFor(a) {
  if (cur && cur !== a) flushSave(cur);
  cur = a; mode = "survey";
  if (a.status !== "completed" && data.assignments.length > 1 && progressOf(a) > 0) return show(firstOpen());
  show(0);
}

function show(next, back = false) {
  mode = "survey";
  idx = Math.max(0, Math.min(lastIdx(), next));
  const s = stepAt(idx);
  const el = paint(idx === 0 ? introHTML() : idx === lastIdx() ? submitHTML() : s.sec != null ? sectionHTML(s) : questionHTML(s.q, s.n), back);
  wire(el);
  chrome();
}

function introHTML() {
  const a = cur, n = qs().filter((q) => q.type === "rating").length, resumed = progressOf(a) > 0;
  const title = isSelf(a) ? "Your 360° self-assessment" : `Feedback for ${esc(a.participant)}`;
  const whose = isSelf(a) ? "your" : `${a.participant}'s`;
  const paras = data.welcome
    ? String(data.welcome).replace(/{{whose}}/g, whose).split(/\n\s*\n/).map((t) => `<p>${esc(t).replace(/\n/g, "<br>")}</p>`).join("")
    : `<p>${isSelf(a) ? "Rate how often you show each behaviour. Be honest: you'll compare your view with how others see you." : `Rate how often ${esc(a.participant)} shows each behaviour, based on your own experience of working together. ${a.relation === "Manager" ? "As their manager, your answers are shown under “Manager”." : "Your answers are combined with others' and never shown with your name."}`}</p>`;
  if (editing()) {
    return `<div class="hero"><h1>${title}</h1><p>You've already submitted this. You can look through your answers and change any of them. Changes are saved only when you press Resubmit at the end.</p>
      <div class="actions"><button class="btn" data-go="start">Review my answers</button><span class="press">press <b>Enter ↵</b></span></div></div>`;
  }
  return `<div class="hero"><h1>${title}</h1>${paras}
    <div class="facts"><span><b>${n}</b>statements</span><span><b>About ${minutesFor(a)} min</b>to complete</span><span><b>Saved</b>as you go</span></div>
    <div class="actions"><button class="btn" data-go="${resumed ? "resume" : "start"}">${resumed ? "Continue" : esc(data.startButton || "Start")}</button>
    <span class="press">press <b>Enter ↵</b></span></div>
    ${data.privacy ? `<p class="privacy">${esc(data.privacy)}</p>` : ""}</div>`;
}

function sectionHTML(s) {
  const about = isSelf(cur) ? "Self-assessment" : `About ${esc(first(cur.participant))}`;
  return `<div class="hero"><div class="eyebrow">${about}</div><h1>${esc(s.sec)}</h1>${s.def ? `<p>${esc(s.def)}</p>` : ""}
    <div class="actions"><button class="btn" data-go="next">Continue</button><span class="press">press <b>Enter ↵</b></span></div></div>`;
}

function questionHTML(q, n) {
  const a = cur;
  const about = isSelf(a) ? q.section : `${q.section} · about ${esc(first(a.participant))}`;
  let body;
  if (q.type === "text") {
    body = `<textarea id="txt-${q.id}" rows="1" placeholder="Type your answer here…">${esc(a.answers[q.id] || "")}</textarea>
      <div class="actions"><button class="btn" data-go="next">OK</button>
      <span class="press"><b>Shift ⇧ + Enter ↵</b> for a new line${q.optional ? " · optional" : ""}</span></div>
      ${isSelf(a) ? "" : a.relation === "Manager" ? `<p class="note">Comments appear in the report word for word, under “Manager”.</p>` : `<p class="note">Comments appear in the report word for word, without your name. Please don't mention names or details that could identify you.</p>`}`;
  } else {
    const max = data.scale.max, min = data.scale.min ?? 1, v = a.answers[q.id];
    let row = "";
    for (let k = min; k <= max; k++) {
      const lab = data.scale.labels[k - min] || "";
      row += `<button class="opt" role="radio" aria-checked="${v === k}" data-v="${k}" title="${esc(lab)}" aria-label="${k}${lab ? ", " + esc(lab) : ""}">${k}${lab && k !== min && k !== max ? `<span class="olab">${esc(lab)}</span>` : ""}</button>`;
    }
    body = `<div class="scale" role="radiogroup" aria-label="${esc(q.text)}">${row}</div>
      <div class="ends"><span>${esc(data.scale.labels[0])}</span><span>${esc(data.scale.labels[max - min])}</span></div>
      <button class="na" role="radio" aria-checked="${q.id in a.answers && v === null}" data-v="na"><span class="key">${min === 0 ? "N" : "0"}</span>I can't say</button>
      <div class="actions"><button class="btn" data-go="next">OK</button><span class="press">${max <= 9 ? `press <b>${min}–${max}</b> or ` : "press "}<b>Enter ↵</b></span></div>`;
  }
  const def = q.type === "rating" && q.definition && !data.sectionScreens ? `<p class="def">${esc(q.definition)}</p>` : "";
  return `<div class="eyebrow">${esc(about)}</div>${def}
    <div class="q"><span class="qnum">${n} →</span><h2 class="qtext">${esc(q.text)}${data.theme && data.theme.required && (q.type === "rating" || !q.optional) ? '<span class="reqmark" aria-label="required">*</span>' : ""}</h2></div>
    <div class="body">${body}<div class="err" id="err" role="alert"></div></div>`;
}

function submitHTML() {
  const a = cur;
  const missing = qs().map((q, i) => ({ q, i })).filter(({ q }) => !answered(a, q));
  const later = data.allowEdit ? "You can come back to this link to change your answers later." : "Once you submit, these answers can't be changed.";
  const list = missing.length
    ? `<p>${missing.length} still to answer:</p><ul class="review">${missing.slice(0, 6).map(({ q, i }) =>
        `<li><button data-jump="${stepOfQ(q)}">${i + 1}. ${esc(q.text)}</button></li>`).join("")}</ul>`
    : editing() ? `<p>Press Resubmit to save your changes${isSelf(a) ? "" : ` for ${esc(first(a.participant))}`}.</p>`
    : `<p>That's everything${isSelf(a) ? "" : ` for ${esc(first(a.participant))}`}. ${later}</p>`;
  return `<div class="hero"><h1>${missing.length ? "Almost there" : editing() ? "Resubmit your answers" : "Ready to submit"}</h1>${list}
    <div class="actions"><button class="btn" data-go="submit" ${missing.length ? "disabled" : ""}>${editing() ? "Resubmit" : "Submit"}</button>
    <span class="press">press <b>Enter ↵</b></span></div><div class="err" id="err" role="alert"></div></div>`;
}

function showEnd(title, text, nextBtn) {
  mode = "end";
  const el = paint(`<div class="hero"><h1>${title}</h1><p>${text}</p>${nextBtn ? `<div class="actions"><button class="btn" data-go="hub">${nextBtn}</button><span class="press">press <b>Enter ↵</b></span></div>` : ""}</div>`);
  el.querySelector('[data-go="hub"]')?.addEventListener("click", () => showHub());
  $("nav").hidden = true; $("back").hidden = true; $("dash").hidden = !(data.preview && data.dashboardUrl); if (!$("dash").hidden) $("dash").href = data.dashboardUrl;
  $("who").textContent = data?.client || "";
  if (!nextBtn) $("bar").style.width = "100%";
}

function choose(q, v) {
  cur.answers[q.id] = v;
  stage.querySelectorAll("[data-v]").forEach((b) => {
    const on = v === null ? b.dataset.v === "na" : Number(b.dataset.v) === v;
    b.setAttribute("aria-checked", on);
    if (on) { b.classList.remove("blink"); void b.offsetWidth; b.classList.add("blink"); }
  });
  if (cur.status === "pending") cur.status = "in_progress";
  queueSave();
  chrome();
  clearTimeout(advanceTimer);
  const at = idx;
  advanceTimer = setTimeout(() => { if (mode === "survey" && idx === at) show(idx + 1); }, 420);
}
const firstOpen = () => { const i = steps().findIndex((s) => s.q && !answered(cur, s.q)); return i === -1 ? lastIdx() : i + 1; };

function goNext() {
  if (mode === "hub" || mode === "plan") return;
  if (mode === "end") { const b = stage.querySelector('[data-go="hub"]'); if (b) b.click(); return; }
  if (idx === 0) return show(progressOf(cur) && !editing() ? firstOpen() : 1);
  if (idx === lastIdx()) return submit();
  const q = curQ();
  if (q && !answered(cur, q)) { $("err").textContent = "Please choose an answer, or pick “I can't say”."; return; }
  show(idx + 1);
}

async function submit() {
  const btn = stage.querySelector('[data-go="submit"]');
  if (!btn || btn.disabled) return;
  const was = editing();
  btn.disabled = true; btn.textContent = was ? "Resubmitting…" : "Submitting…";
  try {
    if (!demo) {
      const p = pendingSaves.get(cur.pid);
      if (p) { clearTimeout(p.timer); pendingSaves.delete(cur.pid); }
      let lastErr = null;
      for (let k = 0; k < 3; k++) {
        try { await api({ t: token, pid: cur.pid, answers: cur.answers, submit: true }); lastErr = null; break; }
        catch (e) {
          // an earlier attempt got through but its reply was lost: the feedback is already saved
          if (k > 0 && /already submitted/i.test(e.message)) { lastErr = null; break; }
          lastErr = e; if (e.final) break; await new Promise((r) => setTimeout(r, 2500 * (k + 1)));
        }
      }
      if (lastErr) throw lastErr;
    }
    cur.status = "completed";
    $("save").textContent = "";
    const left = data.assignments.filter((a) => a.status !== "completed").length;
    const thanks = was
      ? `Your changed answers${isSelf(cur) ? "" : ` for ${esc(cur.participant)}`} have been saved.`
      : data.thankYou
      ? esc(data.thankYou.split("{{participant}}").join(isSelf(cur) ? "yourself" : cur.participant))
      : isSelf(cur)
      ? "Thank you for completing your self-assessment. In your report, your answers will sit next to how others see you, so you can spot your strengths and blind spots."
      : cur.relation === "Manager"
      ? `Your feedback for ${esc(cur.participant)} is in. As their manager, your ratings and comments appear in their report under “Manager”.`
      : `Your feedback for ${esc(cur.participant)} is in. It will be combined with other people's answers and is never shown with your name.`;
    const note = demo ? (data.preview ? " (Preview: nothing was saved.)" : " (Demo: nothing was saved.)") : "";
    const again = data.allowEdit ? " If you need to change anything, open the same link again." : "";
    if (!left) return showEnd("Thank you", `${thanks}${data.assignments.length > 1 && !was ? " That was the last one on your list." : ""}${again} You can close this page.${note}`, data.assignments.length > 1 && data.allowEdit ? "Back to my list" : "");
    showEnd("Thank you", `${thanks}${note} ${left === 1 ? "One more person" : `${left} more people`} on your list.`, "Back to my list");
  } catch (e) {
    btn.disabled = false; btn.textContent = was ? "Resubmit" : "Submit";
    $("err").textContent = e.final ? e.message : e.message + " Please try again in a moment.";
  }
}

function wire(el) {
  el.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
    const g = b.dataset.go;
    if (g === "start") show(1); else if (g === "resume") show(firstOpen()); else if (g === "submit") submit(); else goNext();
  }));
  el.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => show(Number(b.dataset.jump), true)));
  const q = curQ();
  if (q && q.type !== "text")
    el.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => choose(q, b.dataset.v === "na" ? null : Number(b.dataset.v))));
  if (q && q.type === "text") {
    const t = el.querySelector("textarea");
    const fit = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
    t.addEventListener("input", () => { cur.answers[q.id] = t.value; if (cur.status === "pending") cur.status = "in_progress"; fit(); queueSave(); chrome(); });
    t.focus(); fit();
  }
}

document.addEventListener("keydown", (e) => {
  if (!data || mode === "plan") return;
  if (e.isComposing || e.keyCode === 229) return; // typing with an input tool (Hindi, Marathi…): Enter picks a word
  const inText = e.target.tagName === "TEXTAREA";
  const onControl = !inText && /^(BUTTON|A|INPUT|SELECT)$/.test(e.target.tagName);
  if (e.key === "Enter" && onControl) return; // Enter on a button does what that button says
  if (mode === "hub" && !inText && /^[a-z]$/i.test(e.key) && !e.metaKey && !e.ctrlKey) {
    const a = data.assignments[e.key.toUpperCase().charCodeAt(0) - 65];
    if (a && (a.status !== "completed" || data.allowEdit)) startFor(a);
    return;
  }
  if (e.key === "Enter" && !(inText && e.shiftKey)) { e.preventDefault(); goNext(); return; }
  if (inText || mode !== "survey") return;
  const q = curQ();
  if (q && q.type === "rating") {
    const smin = data.scale.min ?? 1;
    if (/^[0-9]$/.test(e.key) && Number(e.key) >= smin && Number(e.key) <= data.scale.max && data.scale.max <= 9) return choose(q, Number(e.key));
    if ((smin === 1 && e.key === "0") || (smin === 0 && /^n$/i.test(e.key))) return choose(q, null);
  }
  if (e.key === "ArrowDown" && idx > 0 && idx < lastIdx()) { e.preventDefault(); show(idx + 1); }
  if (e.key === "ArrowUp" && idx > 1) { e.preventDefault(); show(idx - 1, true); }
});
$("prev").addEventListener("click", () => show(idx - 1, true));
$("next").addEventListener("click", () => show(idx + 1));
$("back").addEventListener("click", () => showHub(true));

async function planInit() {
  mode = "plan";
  stage.innerHTML = `<section class="screen"><p class="press">Loading…</p></section>`;
  let p;
  try { p = await gas("apiPlanLoad", { p: project, t: token }); if (!p.ok) { const err = new Error(p.error); err.closed = p.closed; throw err; } }
  catch (e) { data = {}; return e.closed ? showEnd("This form has closed", esc(e.message)) : showEnd("This link isn't working", "Please check you used the full link from your email."); }
  data = p;
  if (p.logo) { const img = document.createElement("img"); img.className = "clogo"; img.src = p.logo; img.alt = p.client || ""; img.onerror = () => img.remove(); document.querySelector(".brand").after(img); }
  $("who").textContent = p.client || "";
  const el = paint(`<div class="hero"><div class="eyebrow">${esc(p.project)} · Personal Development Plan</div>
    <h1>Development plan for ${esc(p.participant)}</h1>
    <p>Hi ${esc(p.managerName || "there")}. Please write your inputs for ${esc(first(p.participant))}'s development, based on the 360° feedback report. They will appear in the Personal Development Plan section of the report. Fill in the sections that apply; your work is saved as you type.</p>
    ${p.submitted ? `<p class="note">Submitted on ${new Date(p.submitted).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}. You can still make changes and submit again.</p>` : ""}
    ${p.fields.map((f) => `<label class="eyebrow" for="pf_${f.key}" style="display:block;margin:28px 0 8px;font-size:.875rem;color:var(--text-primary)">${esc(f.label)}</label><textarea id="pf_${f.key}" data-key="${f.key}" rows="3" placeholder="Type here…">${esc(p.values[f.key] || "")}</textarea>`).join("")}
    <div class="actions"><button class="btn" id="planGo">${p.submitted ? "Submit changes" : "Submit"}</button><span class="press" id="planMsg"></span></div>
    <div class="err" id="err" role="alert"></div></div>`);
  const vals = () => { const v = {}; el.querySelectorAll("textarea[data-key]").forEach((t) => (v[t.dataset.key] = t.value)); return v; };
  el.querySelectorAll("textarea[data-key]").forEach((t) => {
    const fit = () => { t.style.height = "auto"; t.style.height = Math.max(96, t.scrollHeight) + "px"; };
    fit();
    t.addEventListener("input", () => {
      fit(); clearTimeout(saveTimer); $("save").textContent = "Saving…";
      saveTimer = setTimeout(async () => { try { const r = await gas("apiPlanSave", { p: project, t: token, values: vals() }); $("save").textContent = r.ok ? "Saved" : "Not saved"; } catch { $("save").textContent = "Not saved"; } }, 800);
    });
  });
  $("bar").style.width = "100%";
  $("planGo").addEventListener("click", async (e) => {
    const b = e.target; b.disabled = true; b.textContent = "Submitting…"; clearTimeout(saveTimer);
    try {
      const r = await gas("apiPlanSave", { p: project, t: token, values: vals(), submit: true });
      if (!r.ok) throw new Error(r.error);
      showEnd("Thank you", `Your inputs for ${esc(p.participant)}'s development plan have been saved. If you need to change anything, open the same link again. You can close this page.`);
    } catch (err) { b.disabled = false; b.textContent = "Submit"; $("err").textContent = err.message; }
  });
}

const FONTS = { plex: '"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif', arial: "Arial, Helvetica, sans-serif", georgia: "Georgia, 'Times New Roman', serif", verdana: "Verdana, Geneva, sans-serif", trebuchet: "'Trebuchet MS', Helvetica, sans-serif" };
function applyTheme(t) {
  if (!t) return;
  const hex = (v) => /^#[0-9a-f]{6}$/i.test(v || "");
  const r = document.documentElement.style;
  if (hex(t.color)) { ["--interactive", "--button-primary", "--focus"].forEach((k) => r.setProperty(k, t.color)); r.setProperty("--button-primary-hover", t.color); }
  if (hex(t.bg)) r.setProperty("--background", t.bg);
  if (hex(t.text)) r.setProperty("--text-primary", t.text);
  if (FONTS[t.font]) r.setProperty("--font", FONTS[t.font]);
  document.body.classList.toggle("th-center", t.align === "center");
  document.body.classList.toggle("th-nonum", t.numbers === false);
  document.body.classList.toggle("th-noprog", t.progress === false);
  if (/^https:\/\/\S+$/i.test(t.image || "")) { document.body.classList.add("th-img"); document.body.style.backgroundImage = `url('${String(t.image).replace(/'/g, "%27")}')`; }
}
(async function init() {
  if (params.get("page") === "plan" && GAS) return planInit();
  if (demo) {
    data = JSON.parse(JSON.stringify(DEMO));
    $("demoTag").hidden = false;
  } else {
    stage.innerHTML = `<section class="screen"><p class="press">Loading your survey…</p></section>`;
    try { data = await api(); applyTheme(data.theme); }
    catch (e) { applyTheme(e.theme); return e.closed ? showEnd(esc(e.closedTitle || "This survey has closed"), esc(e.message)) : showEnd("This link isn't working", "Please check you used the full link from your email, or reply to the email that invited you."); }
    if (data.preview) { demo = true; $("demoTag").textContent = "Preview: answers are not saved"; $("demoTag").hidden = false; }
  }
  if (data.logo) {
    const img = document.createElement("img");
    img.className = "clogo"; img.src = data.logo; img.alt = data.client || "Client logo";
    img.onerror = () => img.remove();
    document.querySelector(".brand").after(img);
  }
  data.assignments.sort((a, b) => (isSelf(b) - isSelf(a)) || a.participant.localeCompare(b.participant));
  if (!data.assignments.length) return showEnd("Nothing to do", "There's no one on your list at the moment.");
  if (data.assignments.length === 1) {
    if (data.assignments[0].status === "completed" && !data.allowEdit) return showEnd("Already submitted", "Thank you — your feedback has been received.");
    return startFor(data.assignments[0]);
  }
  showHub();
})();
</script>
