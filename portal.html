const LE360Compute = (() => {
  const RELATIONS = ["Self", "Manager", "Peer", "Reportee", "Other"];

    const count = (rel) => done.filter((r) => r.relation === rel).length;

      const n = count(rel);

    });

    small.forEach((rel) => shownAs.set(rel, merged ? "Others combined" : "Not included"));

    const competencies = [...tpl.competencies].sort((a, b) => a.position - b.position).map((c) => {
      const statements = [...c.statements].sort((a, b) => a.position - b.position).map((st) => {
        const ratingsOf = (list) => nums(list.map((r) => r.ratings[st.id]));
        const byGroup = {};
        groups.forEach((g) => {
          const v = ratingsOf(done.filter((r) => groupOf(r.relation) === g));
          byGroup[g] = g === "Self" || g === "Manager" || v.length >= m ? mean(v) : null;
        });
        const shown = (r) => { const g = groupOf(r.relation); return !!g && byGroup[g] != null; };

        if (weighted) groups.forEach((g) => { if (g !== "Self" && byGroup[g] != null && wOf(g) > 0) { wsum += wOf(g) * byGroup[g]; wtot += wOf(g); } });

          id: st.id, text: st.text, competency: c.name,

      relation: rel, nominated: input.raters.filter((r) => r.relation === rel).length, completed: count(rel), shownAs: shownAs.get(rel) || rel,

      cgroups.filter(enough).forEach((g) => {
        const items = done.filter((r) => commentGroup(r.relation) === g)
          .map((r) => ({ id: r.raterId + ":" + q.id, text: String(r.answers[q.id] == null ? "" : r.answers[q.id]).trim() }))
          .filter((x) => !isBlank(x.text))

    small.forEach((rel) => {
      const n = count(rel);

    if (pool && !dropped.length) notes.push("Written comments from peers, reportees and others are shown together, so no single comment can be traced to a small group.");

    if (!project.include_self_in_overall) notes.push("Overall scores reflect others' ratings only; your self-rating is shown separately.");
    const W = project.weights || {};

      input, groups, participation, overall: mean(nums(competencies.map((c) => c.overall))), competencies,
      perceptionGaps, comments, notes, othersCount: done.filter((r) => r.relation !== "Self").length,
    };
  }
  return { computeReport };
})();
</script>

function shrinkLogo(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const out = (maxW, maxH, type, q) => {
        const k = Math.min(1, maxW / (img.naturalWidth || maxW), maxH / (img.naturalHeight || maxH));
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round((img.naturalWidth || maxW) * k)); c.height = Math.max(1, Math.round((img.naturalHeight || maxH) * k));
        const g = c.getContext("2d"); if (type === "image/jpeg") { g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height); return c.toDataURL(type, q);
      };
      for (const [w, h] of [[600, 240], [400, 160], [280, 112]]) {
        let d = out(w, h, "image/png"); if (d.length <= 45000) return resolve(d);
        d = out(w, h, "image/jpeg", 0.85); if (d.length <= 45000) return resolve(d);
      }
      reject(new Error("That image is too detailed to use as a logo. Try a simpler or smaller file."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't an image we can read. Use a PNG or JPG.")); };
    img.src = url;
  });
}
/** Report cover picture: resized in the browser to at most 1800 pixels across and saved as a JPG under about 1 MB. */
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 25e6) return reject(new Error("That file is over 25 MB. Use a smaller picture."));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const [w, q] of [[1800, 0.82], [1500, 0.78], [1200, 0.72], [1000, 0.68]]) {
        const k = Math.min(1, w / img.naturalWidth), c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const d = c.toDataURL("image/jpeg", q); if (d.length <= 1350000) return resolve(d);
      }
      reject(new Error("That picture is too large to use. Try a smaller one."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a picture we can read. Use a JPG or PNG.")); };
    img.src = url;
  });
}

function distHTML(d) {
  const all = state.dist === "loading" ? null : state.all;
  if (!all) return `<section class="rsec dist"><p class="note">Loading scores…</p></section>`;
  const o = d.settings.options || {};
  const scored = all.filter((x) => x.ready).map((x) => ({ name: x.participant.name, v: LE360Compute.computeReport({ ...x, generatedOn: new Date() }).overall })).filter((x) => x.v != null);
  const smax = (all[0] && all[0].template.scale_max) || 5, smin = (all[0] && all[0].template.scale_min) ?? 1;
  const mean = scored.length ? scored.reduce((a, b) => a + b.v, 0) / scored.length : null;
  const hi = scored.filter((x) => r1(x.v) >= Number(o.strengthCut ?? 3.5)).length, lo = scored.filter((x) => r1(x.v) <= Number(o.improveCut ?? 2.5)).length;
  return `<section class="rsec dist"><h2>Score distribution</h2>
    ${scored.length ? `<div class="dstats"><div><b>${f1(mean)}</b><span>average overall score (out of ${smax}) across ${scored.length} ready report${scored.length === 1 ? "" : "s"}</span></div>
      <div><b>${hi}</b><span>at or above ${esc(o.strengthCut ?? 3.5)} (strength cutoff)</span></div><div><b>${scored.length - hi - lo}</b><span>in between</span></div><div><b>${lo}</b><span>at or below ${esc(o.improveCut ?? 2.5)}</span></div></div>
      ${histSVG(scored.map((x) => x.v), smin, smax)}<p class="rnote">Each bar counts participants whose overall score from others falls in that range. Only reports that are ready are included.</p>`
      : `<p class="rnote">No reports are ready yet.</p>`}</section>`;
}

    v.split("|").forEach((x) => { const p = x.split("="); if (p.length === 2) m[p[0].trim()] = p[1].trim(); });
    return `<fieldset class="qb-field fwide rd-checks"><legend>${esc(label)} (1–5)</legend>${rdCompNames().map((n) => `<label class="rd-bm"><span>${esc(n)}</span><input type="number" step="0.1" min="1" max="5" data-rdb="${esc(n)}" value="${esc(m[n] || "")}"></label>`).join("")}</fieldset>`;
  }
  return `<label class="qb-field"><span>${esc(label)}</span><input data-rdf="${k}" ${type === "n" ? 'type="number" step="0.1" min="0"' : type === "i" ? 'type="number" step="1" min="1"' : ""} value="${esc(v)}"></label>`;
}
function renderReportDesigner() {
  const r = state.rd, name = (id) => (id === "cover" ? "Cover" : REPORT_SECTIONS.find((x) => x[0] === id)[1]);
  const fields = RD_FIELDS[r.sel] || [];

          <span class="rd-tools"><button class="qb-tool" data-rdmove="${i}:-1" aria-label="Move ${esc(name(x.id))} up" ${i === 0 ? "disabled" : ""}>↑</button><button class="qb-tool" data-rdmove="${i}:1" aria-label="Move ${esc(name(x.id))} down" ${i === r.layout.length - 1 ? "disabled" : ""}>↓</button>
            <label class="switch" title="${x.on ? "Switch off" : "Switch on"}"><input type="checkbox" data-rdon="${i}" ${x.on ? "checked" : ""} aria-label="Show ${esc(name(x.id))} in the report"><span></span></label></span>

          ${["hidden", "blind"].includes(r.sel) ? `<p class="small">Gap = self rating minus others' average, each rounded to one decimal. ${r.sel === "hidden" ? "A hidden strength is where others rate you at least the gap above your own rating." : "A blind spot is where you rate yourself at least the gap above others' rating."} With <b>Statements</b>, each statement is checked on its own; with <b>Competencies</b>, the average of a competency's statements is used.</p>` : ""}
          ${r.sel === "comments" ? `<p class="small">Comments are shown only for groups with at least the minimum number of writers.</p>` : ""}

}
function rdRefreshPreview() {
  const box = document.getElementById("rdPreview"); if (!box) return;
  const top = box.scrollTop; box.innerHTML = rdPreviewHTML(state.rd); box.scrollTop = top;
  const st = document.getElementById("rdStatus"); if (st) { st.textContent = "Unsaved changes"; st.className = "qb-status dirty"; }
}
function rdScrollTo(id) {
  const box = document.getElementById("rdPreview"), el = box && box.querySelector(`[data-sec="${id}"]`);
  if (el) box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - 8;
}
function wireReportDesigner() {
  const r = state.rd;
  app.querySelectorAll("[data-rdsel]").forEach((b) => b.addEventListener("click", () => { r.sel = b.dataset.rdsel; render(); rdScrollTo(r.sel); }));
  app.querySelectorAll("[data-rdmove]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); const [i, dir] = b.dataset.rdmove.split(":").map(Number); const j = i + dir; [r.layout[i], r.layout[j]] = [r.layout[j], r.layout[i]]; r.dirty = true; render(); rdScrollTo(r.layout[j].id); }));
  app.querySelectorAll("[data-rdon]").forEach((c) => c.addEventListener("change", () => { const x = r.layout[+c.dataset.rdon]; x.on = c.checked; r.dirty = true; render(); if (x.on) rdScrollTo(x.id); }));
  app.querySelectorAll("[data-rdf]").forEach((f) => f.addEventListener(f.tagName === "SELECT" ? "change" : "input", () => {
    const k = f.dataset.rdf; r.vals[k] = f.value; r.dirty = true;
    if (/By$/.test(k)) {
      const tk = k.replace(/By$/, "Text"), t = String(r.vals[tk] || "");
      r.vals[tk] = f.value === "statement" ? t.replace(/competencies/g, "statements").replace(/Competencies/g, "Statements") : t.replace(/statements/g, "competencies").replace(/Statements/g, "Competencies");
      const box = app.querySelector(`[data-rdf="${tk}"]`); if (box) box.value = r.vals[tk];
    }
    if (k === "benchmark") { render(); return; }
    clearTimeout(state.rdTimer); state.rdTimer = setTimeout(rdRefreshPreview, f.tagName === "SELECT" || f.type === "color" ? 0 : 250);
  }));
  app.querySelectorAll("[data-rdc]").forEach((c) => c.addEventListener("change", () => {
    const k = c.dataset.rdc;
    r.vals[k] = [...app.querySelectorAll(`[data-rdc="${k}"]`)].filter((x) => !x.checked).map((x) => x.value).join("|");
    r.dirty = true; rdRefreshPreview();
  }));
  app.querySelectorAll("[data-rdb]").forEach((c) => c.addEventListener("input", () => {
    r.vals.benchmarkValues = [...app.querySelectorAll("[data-rdb]")].filter((x) => x.value !== "").map((x) => `${x.dataset.rdb}=${x.value}`).join("|");
    r.dirty = true; clearTimeout(state.rdTimer); state.rdTimer = setTimeout(rdRefreshPreview, 250);
  }));
  app.querySelectorAll("[data-rddrag]").forEach((el) => {
    el.addEventListener("dragstart", (e) => { state.rdDrag = +el.dataset.rddrag; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "rd"); el.classList.add("dragging"); });
    el.addEventListener("dragover", (e) => { if (state.rdDrag != null) { e.preventDefault(); el.classList.add("dropover"); } });
    el.addEventListener("dragleave", () => el.classList.remove("dropover"));
    el.addEventListener("drop", (e) => { e.preventDefault(); const from = state.rdDrag, to = +el.dataset.rddrag; state.rdDrag = null; if (from == null || from === to) return render(); const x = r.layout.splice(from, 1)[0]; r.layout.splice(to, 0, x); r.dirty = true; render(); rdScrollTo(x.id); });
  });
  if (r.vals.coverImage === "asset:cover" && state.coverData == null && !state.coverLoading) {
    state.coverLoading = true;
    admin("coverImage").then((x) => { state.coverData = x.data || ""; state.coverLoading = false; if (state.rd) render(); }).catch(() => { state.coverLoading = false; });
  }
  document.getElementById("rdCoverFile")?.addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = await shrinkPhoto(f);
      const res = await admin("saveCoverImage", { data });
      state.coverData = data; r.vals.coverImage = "asset:cover"; render(); rdScrollTo("cover"); toast(res.message);
    } catch (err) { toast(err.message, true); }
  });
  document.getElementById("rdCoverDel")?.addEventListener("click", async () => {
    try { const res = await admin("saveCoverImage", { data: "" }); state.coverData = ""; r.vals.coverImage = ""; render(); toast(res.message); } catch (err) { toast(err.message, true); }
  });
  document.getElementById("rdSave").addEventListener("click", async (e) => {
    const b = e.target; b.disabled = true; b.textContent = "Saving…";
    try {
      const res = await admin("saveReportDesign", { options: Object.assign({}, r.vals, { reportLayout: rdLayoutStr(r) }) });
      state.data = await admin("dashboard"); state.rd = rdModel(state.data.settings.options || {}); state.rd.sel = r.sel; render(); rdScrollTo(r.sel); toast(res.message);
    } catch (err) { b.disabled = false; b.textContent = "Save"; toast(err.message, true); }
  });
  rdScrollTo(r.sel);
}

function renderReport() {

async function openOverview(btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Loading…"; }

}
function histSVG(vals, lo = 1, hi = 5) {
  const step = (hi - lo) / 16, bins = [];
  for (let i = 0; i < 16; i++) bins.push({ a: lo + i * step, b: lo + (i + 1) * step, n: 0 });
  vals.forEach((v) => { const i = Math.min(bins.length - 1, Math.max(0, Math.floor((v - lo) / step))); bins[i].n++; });
  const top = Math.max(1, ...bins.map((b) => b.n)), W = 720, H = 220, pad = 28, bw = (W - pad * 2) / bins.length;
  let s = `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="How participants' overall scores are spread">`;
  bins.forEach((b, i) => {
    const h = ((H - 60) * b.n) / top, x = pad + i * bw, y = H - 32 - h;
    if (b.n) s += `<rect x="${x + 2}" y="${y}" width="${bw - 4}" height="${h}" fill="#0f62fe"/><text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="12" fill="currentColor">${b.n}</text>`;
  });
  for (let v = lo; v <= hi; v++) { const x = pad + ((v - lo) / step) * bw; s += `<line x1="${x}" y1="${H - 32}" x2="${x}" y2="${H - 26}" stroke="currentColor" stroke-opacity=".4"/><text x="${x}" y="${H - 10}" text-anchor="middle" font-size="12" fill="currentColor">${v}</text>`; }
  s += `<line x1="${pad}" y1="${H - 32}" x2="${W - pad}" y2="${H - 32}" stroke="currentColor" stroke-opacity=".4"/>`;
  return s + "</svg>";
}
function renderOverview() {
  const d = state.data, all = state.all || [];
  const rows = all.map((input) => {
    const r = LE360Compute.computeReport({ ...input, generatedOn: new Date() });
    const done = input.raters.filter((x) => x.status === "completed");
    const comps = r.competencies.filter((c) => c.overall != null).sort((a, b) => b.overall - a.overall);
    return { input, r, name: input.participant.name, overall: r.overall, self: r.competencies.some((c) => c.self != null) ? avg(r.competencies.map((c) => c.self).filter((x) => x != null)) : null,
      selfDone: input.raters.some((x) => x.relation === "Self" && x.status === "completed"), allDone: done.length === input.raters.length, ready: input.ready,
      top: comps[0], low: comps[comps.length - 1] };
  });
  const scored = rows.filter((x) => x.overall != null && x.ready);
  const smax = (all[0] && all[0].template.scale_max) || 5, smin = (all[0] && all[0].template.scale_min) ?? 1;
  const cohort = scored.length ? avg(scored.map((x) => x.overall)) : null;
  const compNames = (all[0] && all[0].template.competencies.map((c) => c.name)) || [];
  const compAvg = compNames.map((n) => {
    const o = scored.map((x) => x.r.competencies.find((c) => c.name === n)).filter((c) => c && c.overall != null);
    const s = o.filter((c) => c.self != null);
    return { name: n, others: o.length ? avg(o.map((c) => c.overall)) : null, self: s.length ? avg(s.map((c) => c.self)) : null };
  });
  const ready = rows.filter((x) => x.ready);
  app.innerHTML = `<div class="overview">
    <div class="rtools"><button class="btn ghost" id="back">← Back to results</button></div>
    <header class="top" style="margin-bottom:24px"><div><div class="brand">${esc(d.client)}</div><h1 class="proj">Overview · ${esc(d.project)}</h1>
      <div class="sub">Scores are others' ratings, on a ${smin}–${smax} scale. Only participants whose report is ready are included in the averages.</div></div></header>
    <div class="ov-actions">
      <button class="btn" id="allPdf" ${ready.length ? "" : "disabled"}>Download all reports (PDF) · ${ready.length}</button>
      <button class="btn tertiary" id="allXlsx">Download all answers (Excel, anonymous)</button>
      <button class="btn ghost" id="allXlsxFull">Internal copy with rater names</button></div>
    <p class="small" style="margin:-12px 0 24px">The anonymous file has no rater names or emails and is safe to share with the client. The internal copy shows who said what: keep it to yourself.</p>
    <section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="stat"><div class="k">Overall score</div><div class="v">${f1(cohort)} <small>of ${smax}</small></div></div>
      <div class="stat"><div class="k">Participants</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="k">Self-assessed</div><div class="v">${rows.filter((x) => x.selfDone).length}</div></div>
      <div class="stat"><div class="k">All feedback in</div><div class="v">${rows.filter((x) => x.allDone).length}</div></div>
      <div class="stat"><div class="k">Reports ready</div><div class="v">${ready.length}</div></div>
      <div class="stat"><div class="k">Reports pending</div><div class="v">${rows.length - ready.length}</div></div>
    </section>
    <section class="rsec"><h2>How overall scores are spread</h2><p class="lead">Number of participants at each overall score.</p>${scored.length ? histSVG(scored.map((x) => x.overall), smin, smax) : `<p class="rnote">No reports are ready yet.</p>`}</section>
    <section class="rsec"><h2>Competencies across the group</h2>
      <div class="table"><table class="rt"><thead><tr><th>Competency</th><th class="n">Others</th><th class="n">Self</th></tr></thead><tbody>
      ${compAvg.map((c) => `<tr><td>${esc(c.name)}</td><td class="n ${heat(c.others, smax)}">${f1(c.others)}</td><td class="n">${f1(c.self)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="rsec"><h2>Participants</h2>
      <div class="table"><table class="rt"><thead><tr><th>Participant</th><th class="n">Overall</th><th class="n">Self</th><th>Highest competency</th><th>Lowest competency</th><th>Report</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.ready ? f1(x.overall) : "–"}</td><td class="n">${f1(x.self)}</td><td>${x.ready && x.top ? esc(x.top.name) : "–"}</td><td>${x.ready && x.low ? esc(x.low.name) : "–"}</td>
        <td>${x.ready ? `<span class="pill done">Ready</span>` : `<span class="pill wait">Pending</span>`}</td></tr>`).join("")}</tbody></table></div></section></div>`;
  document.getElementById("back").addEventListener("click", () => { state.view = "dash"; state.all = null; render(); });
  document.getElementById("allPdf").addEventListener("click", () => { state.view = "allReports"; state.batch = 0; render(); window.scrollTo(0, 0); });
  const download = async (b, full, label) => {
    b.disabled = true; b.textContent = "Preparing…";
    try {
      const res = await admin("exportResponses", { full });
      await loadSheetJS();
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res.rows), "Answers");
      XLSX.writeFile(wb, res.filename);
      toast(full ? "Internal copy downloaded. It shows rater names: don't share it." : "Anonymous answers downloaded.");
    } catch (err) { toast(err.message, true); }
    b.disabled = false; b.textContent = label;
  };
  document.getElementById("allXlsx").addEventListener("click", (e) => download(e.target, false, "Download all answers (Excel, anonymous)"));
  document.getElementById("allXlsxFull").addEventListener("click", (e) => {
    const b = e.target;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Click again: this file shows who said what"; return; }
    b.dataset.sure = ""; download(b, true, "Internal copy with rater names");
  });
}
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
const BATCH = 15;
function renderAllReports() {
  const all = (state.all || []).filter((x) => x.ready);
  const batches = Math.max(1, Math.ceil(all.length / BATCH));
  const b = Math.min(state.batch || 0, batches - 1);
  const list = all.slice(b * BATCH, b * BATCH + BATCH);
  const picker = batches > 1 ? `<div class="ov-actions" style="max-width:960px;margin:0 auto 16px" role="group" aria-label="Choose which reports to print">${Array.from({ length: batches }, (_, i) => `<button class="btn ${i === b ? "" : "tertiary"}" data-batch="${i}" aria-pressed="${i === b}">Reports ${i * BATCH + 1}–${Math.min(all.length, (i + 1) * BATCH)}</button>`).join("")}</div>` : "";
  app.innerHTML = `<div class="rtools" style="max-width:960px;margin:0 auto 12px"><button class="btn ghost" id="back">← Back to overview</button>
      <div class="right"><button class="btn" id="print">Print or save as PDF</button></div></div>
      ${picker}
      <div class="reviewnote" style="max-width:960px;margin:0 auto 24px">${list.length} report${list.length === 1 ? "" : "s"}${batches > 1 ? ` (batch ${b + 1} of ${batches}, printed ${BATCH} at a time so the browser doesn't run out of memory)` : ""}, one after another; each starts on a new page. Read the comments first: click a comment to edit it, or press Hide. Then choose "Save as PDF" in the print window.</div>
    ${list.map((input, i) => (i ? `<div class="rbreak"></div>` : "") + reportHTML(input)).join("")}`;
  app.querySelectorAll("[data-batch]").forEach((x) => x.addEventListener("click", () => { state.batch = Number(x.dataset.batch); render(); window.scrollTo(0, 0); }));
  document.getElementById("back").addEventListener("click", () => { state.view = "overview"; render(); window.scrollTo(0, 0); });
  document.getElementById("print").addEventListener("click", () => window.print());
  setPageFooter(list.length ? (list[0].options || {}).reportFooter || DEF_OPTS.reportFooter : "");
  wireReportBits();
}

async function start() {
  if (state.project) {
    state.view = "dash";
    try { state.data = await admin("dashboard"); return render(); }
    catch (err) { if (err.notOwner) throw err; state.project = ""; }
  }
  state.view = "projects";
  const pr = await admin("projects");
  state.projects = pr.projects; state.publicUrl = pr.publicUrl || "";
  render();
}
(async function init() {
  if (params.get("page") === "portal" && GAS) return portalInit();
  if (demo) return start();
  app.innerHTML = `<p class="note">Loading…</p>`;
  try { await admin("status"); await start(); }
  catch (err) { if (!err.notOwner) notOwner(err.message); }
})();
